<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a6fa5">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#1f2d3d;--mute:#6b7c8f;--line:#dde5ee;--steel:#4a6fa5;--steel-d:#2f4e7c;--steel-l:#e6edf6;
--ok:#2e8b6a;--okb:#e3f4ed;--warn:#b7791f;--warnb:#fdf1da;--stop:#7a8794;--stopb:#eceff2;--urg:#c0392b;--urgb:#fbe9e7;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:none){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a24;--card:#1b2633;--ink:#e6edf5;--mute:#93a3b5;--line:#2b394a;--steel:#7ea3d6;--steel-d:#a9c4ea;--steel-l:#233349;--okb:#16342a;--warnb:#3a2f17;--stopb:#27313c;--urgb:#3d2320}}
:root[data-theme="none"]{color-scheme:dark;--bg:#121a24;--card:#1b2633;--ink:#e6edf5;--mute:#93a3b5;--line:#2b394a;--steel:#7ea3d6;--steel-d:#a9c4ea;--steel-l:#233349;--okb:#16342a;--warnb:#3a2f17;--stopb:#27313c;--urgb:#3d2320}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100%}
nav{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;color:var(--steel-d);padding:0 8px 14px;font-size:17px}
.logo span{color:var(--steel)}
nav button{display:flex;gap:10px;align-items:center;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer;color:var(--mute);text-align:left}
nav button.on{background:var(--steel-l);color:var(--steel-d);font-weight:600}
main{padding:18px 22px 90px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0;color:var(--steel-d)}
.sub{color:var(--mute);font-size:13px}
.btn{background:var(--steel);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--steel-l);color:var(--steel-d)}
.btn.sm{padding:4px 10px;font-size:13px}
.week{display:flex;gap:6px;align-items:center;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.day{flex:1;min-width:52px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;cursor:pointer}
.day small{display:block;color:var(--mute);text-transform:uppercase;font-size:11px}
.day b{font-size:16px}
.day.today small{color:var(--steel)}
.day.sel{background:var(--steel);border-color:var(--steel);color:#fff}.day.sel small{color:#dfe9f7}
.arrow{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:44px;cursor:pointer}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.urg{background:var(--urgb);border:1px solid color-mix(in srgb,var(--urg) 30%,transparent);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.urg h3{margin:0 0 6px;font-size:13px;color:var(--urg);text-transform:uppercase;letter-spacing:.04em}
.urg div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:.15s}
.person.over{outline:2px dashed var(--steel);background:var(--steel-l)}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ph .n{font-weight:600}.ph .r{font-size:12px;color:var(--mute)}
.ph .btn{margin-left:auto}
.task{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.task:hover{border-color:var(--steel)}
.tt{display:flex;justify-content:space-between;gap:8px;align-items:start}
.tt b{font-size:14px}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:2px 8px;white-space:nowrap}
.s-proceso{background:var(--okb);color:var(--ok)}.s-parada{background:var(--stopb);color:var(--stop)}
.s-pendiente{background:var(--warnb);color:var(--warn)}.s-finalizada{background:var(--steel-l);color:var(--steel-d)}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:6px;align-items:center}
.dur{font-weight:700;color:var(--steel-d)}
.last{font-size:12.5px;margin-top:6px;color:var(--ink);border-left:3px solid var(--steel);padding-left:8px}
.last i{color:var(--mute);font-style:normal}
.free{border:1px dashed var(--warn);background:var(--warnb);color:var(--warn);border-radius:12px;padding:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:12px}
.side h3{margin:0 0 4px;font-size:15px;color:var(--steel-d)}
.bl{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;cursor:grab;background:var(--bg);font-size:13px}
.bl:active{cursor:grabbing}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.row .grow{flex:1;min-width:140px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.form input{flex:1;min-width:140px}
dialog{border:0;border-radius:18px;padding:18px;width:min(660px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,35,55,.45)}
.notes{max-height:150px;overflow:auto;margin-top:6px}
.notes div{font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}.notes i{font-style:normal;color:var(--steel);font-weight:600}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.tip{font-size:12px;color:var(--mute);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:24px;color:var(--steel-d)}.kpi span{font-size:12px;color:var(--mute)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--steel)}
.sync{margin-top:auto;font-size:12px;padding:8px 10px;border-radius:10px;cursor:pointer;background:var(--steel-l);color:var(--steel-d)}.sync.err{background:var(--urgb);color:var(--urg)}.sync.busy{color:var(--mute)}
.s-baja{background:#e3e8fb;color:#4c5bb5}.task.baja{background:#eef1fb;border-color:#aab6e6}.task.baja:hover{border-color:#6f7fd0}
.foot{margin-top:28px;padding-top:10px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--mute)}.foot.lg{cursor:pointer}.foot.lg:hover{color:var(--steel-d)}
.tabs{display:flex;gap:4px;background:var(--steel-l);border-radius:12px;padding:4px;margin:0 0 16px;width:fit-content}.tabs button{border:0;background:none;padding:7px 18px;border-radius:9px;cursor:pointer;color:var(--steel-d);font-weight:600}.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(30,50,80,.15)}
.qf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.qf label{margin:0 0 3px}
.cal{width:18px;height:18px;vertical-align:-4px;flex:none}.rbadge{margin-left:auto;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 6px}
.task.reunion{background:#eef4fb;border-color:#9fc2ea}.task.reunion:hover{border-color:#2b6cb0}.task.reunion.min{background:#f8eef6;border-color:#d9a4cc}.task.reunion.min:hover{border-color:#a8328f}
.s-reunion{background:#dce9f7;color:#2b6cb0}.s-reunion-min{background:#f3dcef;color:#a8328f}
@media(max-width:700px){nav{overflow-x:auto;justify-content:flex-start}nav button{flex:none;position:relative}.rbadge{position:absolute;top:0;right:0;margin:0}}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#b9c4d0;border:2px solid var(--card)}.dot.on{background:#2fb36b}
.dl{max-width:760px;margin:0 auto;text-align:center;padding-top:6px}.dl-name{font-size:clamp(30px,7vw,76px);font-weight:700;color:var(--steel-d);margin:26px 0 8px;line-height:1.1}.dl-n{font-size:clamp(18px,3vw,26px);color:var(--mute);margin-bottom:22px}.dl-t{text-align:left;max-width:560px;margin:22px auto 0}.dl-set{max-width:640px}
.btn.big{font-size:20px;padding:12px 34px}.btn:disabled{opacity:.5;cursor:default}
.upd{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(30,50,80,.18);font-size:14px}.upd[hidden]{display:none}
@media(max-width:700px){.upd{left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
.s-vacaciones{background:#d9f2ee;color:#17796b}.task.vacaciones{background:#ecf9f6;border-color:#86cfc3}.task.vacaciones:hover{border-color:#3fa797}
.ro button[onclick*="openTask("],.ro [onclick*="libre("],.ro [onclick*="pick("],.ro select[onchange*="assign"],.ro .form,.ro button[onclick*="delP"],.ro button[onclick*="editP"],.ro button[onclick*="setAdm"],.ro button[onclick*="resetPw"],.ro button[onclick*="setMain"],.ro [onclick*="loadDemo"]{display:none!important}.ro .bl{cursor:default}.ur .bl[draggable="true"]{cursor:grab}
.ur [onclick*="pick("],.ur select[onchange*="assign"],.ur .form,.ur button[onclick*="delP"],.ur button[onclick*="editP"],.ur button[onclick*="setAdm"],.ur button[onclick*="resetPw"],.ur button[onclick*="setMain"],.ur [onclick*="loadDemo"],.ur button[onclick*="openTask(0,null)"]{display:none!important}.ur .bl{cursor:default}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;border:1px solid var(--line);border-radius:9px;padding:8px;max-height:112px;overflow:auto}.chk label{display:flex;gap:5px;align-items:center;margin:0;font-size:14px;color:var(--ink)}.chk input{width:auto}
.pi{width:1.05em;height:1.05em;fill:#e8543a;vertical-align:-2px;margin-right:3px}.urg h3 .pi{fill:var(--urg)}
.ms-f{display:flex;align-items:center;gap:6px;min-height:38px;padding:4px 8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;cursor:pointer}.ms-f:hover{border-color:var(--steel)}
.ms-cs{display:flex;flex-wrap:wrap;gap:5px;flex:1}.ms-ar{margin-left:auto;color:var(--mute)}.ms-ph{color:var(--mute);padding-left:2px}
.ms-chip{background:var(--steel-l);color:var(--steel-d);border-radius:6px;padding:2px 8px;display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:600}.ms-chip b{cursor:pointer;color:var(--mute)}.ms-chip b:hover{color:var(--urg)}
.ms-p{border:1px solid var(--line);border-radius:10px;margin-top:5px;background:var(--card);box-shadow:0 8px 22px rgba(30,50,80,.16);overflow:hidden}
.ms-p input{border:0;border-bottom:1px solid var(--line);border-radius:0}#ms-l{max-height:190px;overflow:auto}
.ms-o{padding:9px 12px;cursor:pointer}.ms-o:hover{background:var(--steel-l)}.ms-o.on{background:var(--steel-l);color:var(--steel-d);font-weight:600}
.s-libre{background:#fde3c8;color:#b45309}.task.libre{background:#fff3e3;border-color:#f3b676}.task.libre:hover{border-color:#e08a2e}
@media(max-width:700px){.sync{display:none}}
.b-ok{background:var(--steel)}.b-warn{background:#d69e2e}.b-hi{background:#c0392b}
.t-ok{color:var(--steel-d)}.t-warn{color:#b7791f}.t-hi{color:#c0392b}
.lnk{cursor:pointer;color:var(--steel-d);font-weight:600}.lnk:hover{text-decoration:underline}
.th{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:12px}.th input{width:64px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}}
@media(max-width:700px){
.app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 6px;align-items:center}.logo{display:none}
main{padding:14px 12px 90px}
}
.s-error{background:#fde0e0;color:#b42318}.task.error{background:#fff1f1;border-color:#f0a3a3}.task.error:hover{border-color:#d44}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;line-height:1.35}
.rem{position:fixed;top:14px;right:14px;z-index:30;display:flex;flex-direction:column;gap:8px;max-width:360px}.rem[hidden]{display:none}
.remc{background:var(--card);border:1px solid var(--line);border-left:4px solid #2b6cb0;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(30,50,80,.22);font-size:14px}.remc.min{border-left-color:#a8328f}
@media(max-width:700px){.rem{left:12px;right:12px;max-width:none;top:calc(10px + env(safe-area-inset-top,0px))}}
.pg{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:12px;color:var(--mute)}.pg button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div class="app">
<nav>
 <div class="logo">Daily<span>Tracker</span></div>
 <button data-v="diario" class="on">📋 Diario</button>
 <button data-v="daily">🎲 Daily</button>
 <button data-v="prio"><svg class="pi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> Prioritarias</button>
 <button data-v="backlog">🗂️ Backlog</button>
 <button data-v="reu">📅 Reuniones</button>
 <button data-v="stats">📊 Estadísticas</button>
 <button data-v="equipo">⚙️ Equipo</button>
 <div id="sync" class="sync" onclick="openCfg()">Local</div>
</nav>
<main id="main"></main>
</div>

<dialog id="dlg"></dialog><div id="rem" class="rem" hidden></div>
<div id="upd" class="upd" hidden><span>🔄 Hay cambios nuevos</span><button class="btn sm" onclick="applyPending()">Actualizar</button><button class="btn ghost sm" onclick="dismissUpd()">Ahora no</button></div>

<script>window.addEventListener('error',function(e){var m=document.getElementById('main');if(m&&!m.firstChild){var d=document.createElement('div');d.style.cssText='padding:24px;max-width:560px';d.textContent='Error al iniciar la app ('+e.message+'). Recarga la página con Ctrl+F5; si sigue igual, avisa al administrador.';m.appendChild(d)}});</script>
<script>
const $=s=>document.querySelector(s);
const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let today=new Date();today.setHours(0,0,0,0);
const off=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return f(d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={proceso:'En proceso',parada:'Parada',pendiente:'Pendiente',finalizada:'Finalizada'};
let view='diario',sel=f(today),wk=0,uid=100;

// Datos de ejemplo (en la app real: JSON)
let people=[
 {id:1,name:'Laura Gómez',role:'Backend'},{id:2,name:'Carlos Ruiz',role:'Frontend'},
 {id:3,name:'Marta Peña',role:'QA'},{id:4,name:'Iván Soto',role:'DevOps'},
 {id:5,name:'Ana Vidal',role:'Backend'},{id:6,name:'Pablo Díaz',role:'Analista'}];
let tasks=[
 {id:1,title:'API de facturación',desc:'Endpoints de emisión y anulación',start:off(-6),end:'',status:'proceso',owner:1,urgent:true,notes:[{d:off(-6),t:'Arranca el diseño'},{d:off(-1),t:'Continúa: problemas con el entorno de pruebas'},{d:off(0),t:'Pendiente de revisión de contrato'}]},
 {id:2,title:'Pantalla de informes',desc:'Filtros y exportación',start:off(-3),end:'',status:'proceso',owner:2,urgent:false,notes:[{d:off(-3),t:'Maqueta aprobada'}]},
 {id:3,title:'Regresión release 4.2',desc:'Casos críticos',start:off(-2),end:'',status:'proceso',owner:3,urgent:true,notes:[{d:off(-2),t:'20 de 60 casos ejecutados'}]},
 {id:4,title:'Pipeline de despliegue',desc:'Migrar a nuevo agente',start:off(-9),end:'',status:'parada',owner:4,urgent:false,notes:[{d:off(-5),t:'Parada: esperando permisos'}]},
 {id:5,title:'Migración de usuarios',desc:'Script de carga',start:off(-12),end:off(-4),status:'finalizada',owner:5,urgent:false,notes:[]},
 {id:6,title:'Notificaciones por email',desc:'Plantillas y colas',start:'',end:'',status:'pendiente',owner:null,urgent:false,notes:[]},
 {id:7,title:'Revisar logs de producción',desc:'Picos de errores 500',start:'',end:'',status:'pendiente',owner:null,urgent:true,notes:[]},
 {id:8,title:'Documentar API pública',desc:'',start:'',end:'',status:'pendiente',owner:null,urgent:false,notes:[]}];

const DEMO=JSON.stringify({people,tasks});people=[];tasks=[];
const days=t=>t.start?Math.max(1,Math.round((new Date(t.end||f(today))-new Date(t.start))/864e5)+1):0;
const dur=t=>{const n=days(t);return n?(n===1?'1 día':n+' días'):'—'};
const fmt=s=>s?new Date(s).toLocaleDateString('es-ES',{day:'2-digit',month:'short',timeZone:'UTC'}):'—';
let LIM={warn:5,high:10};
const has=(t,id)=>(t.owners||[]).includes(id);
const PI='<svg class="pi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';
function jor(a,b){if(!a||!b)return 0;const e=new Date(b);let d=new Date(a),n=0;for(;d<=e;d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w&&w<6)n++}return n}
const jtxt=(a,b)=>{const n=jor(a,b);return n?n+(n===1?' jornada':' jornadas'):''};
const names=t=>(t.owners||[]).map(o=>(person(o)||{}).name).filter(Boolean).join(', ');
const isT=t=>!t.tipo||t.tipo==='tarea'||t.tipo==='error';
const nid=()=>Date.now()*10+Math.floor(Math.random()*10);
const lv=n=>n>=LIM.high?'hi':n>=LIM.warn?'warn':'ok';
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const person=id=>people.find(p=>p.id===id);

function week(){
 const base=new Date(today);const dow=(base.getDay()+6)%7;base.setDate(base.getDate()-dow+wk*7);

async function readFile(url){
 const q=url+'?t='+Date.now()+(cfg.branch?'&ref='+cfg.branch:'');
 const r=await fetch(q,{headers:H(),cache:'no-store'});
 if(r.status===404)return{sha:null,text:null};
 if(!r.ok)throw new Error('GitHub respondió '+r.status);
 let j;try{j=await r.json()}catch(e){throw new Error('GitHub devolvió una respuesta vacía')}
 let text=j.content?decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))):'';
 if(!text&&j.size>0){const r2=await fetch(q,{headers:{...H(),Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(!r2.ok)throw new Error('GitHub respondió '+r2.status);text=await r2.text()}
 return{sha:j.sha,text}}
async function pull(){
 if(!linked())return setSt('','Local · sin GitHub');
 setSt('busy','Sincronizando…');
 let x;try{x=await readFile(apiUrl())}catch(e){setSt('err','Error al leer ('+e.message+')');return}
 if(x.text===null){sha=null;dirty=true;return push()}
 sha=x.sha;
 if(!x.text.trim()){if(ro()){setSt('err','El fichero de datos está vacío');return}dirty=true;return push()}
 let o;try{o=JSON.parse(x.text)}catch(e){setSt('err','El fichero de datos no es un JSON válido ('+e.message+'). No se ha modificado: revísalo en GitHub.');return}
 if(!o||typeof o!=='object'||Array.isArray(o)){setSt('err','El fichero de datos no tiene el formato esperado. No se ha modificado.');return}
 people=o.people||[];tasks=o.tasks||[];auth=o.auth||null;norm();cache();pend=null;dis=null;showUpd(false);setSt('ok','☁ Sincronizado '+hora());
 try{if(!$('#dlg').open){draw();if(!ro()&&people.length&&!me())openMe()}}catch(e){setSt('err','Error al mostrar los datos ('+e.message+')')}}
/* Sondeo ligero: solo descarga el fichero entero (unos MB) cuando cambia el sha */
async function check(){
 if(!linked()||dirty||pushing)return;
 try{const r=await fetch(apiUrl()+'?t='+Date.now()+(cfg.branch?'&ref='+cfg.branch:''),{headers:H(),cache:'no-store'});
  if(!r.ok)return;const m=await r.json();
  if(m.sha===sha){pend=null;showUpd(false);return}
  if(m.sha===dis)return;
  const x=await readFile(apiUrl());
  if(x.text===null||!x.text.trim())return;
  let o;try{o=JSON.parse(x.text)}catch(e){return}
  if(!o||typeof o!=='object'||Array.isArray(o))return;
  pend={sha:x.sha,o};showUpd(true)}catch(e){}}

async function push(){
 if(!linked()||ro())return;if(pushing){queued=true;return}
 pushing=true;setSt('busy','Guardando…');
 try{const b={message:'Daily Tracker '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(snap())))};
  if(sha)b.sha=sha;if(cfg.branch)b.branch=cfg.branch;
  const r=await fetch(apiUrl(),{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(b)});
  if(r.status===409||r.status===422){dirty=false;pushing=false;setSt('err','Conflicto con otro dispositivo: recargando, repite el cambio');return pull()}
  if(!r.ok)throw new Error(r.status);
  sha=(await r.json()).content.sha;dirty=false;setSt('ok','☁ Guardado '+hora())}
 catch(e){setSt('err',e.message==='403'?'Sin permiso de escritura: token de solo lectura o límite de GitHub':'No se pudo guardar ('+e.message+')')}

 const tbl=(L,e)=>`<div class='tw'><table style='min-width:760px'><tr><th></th><th>Hora</th><th>Reunión</th><th>Tipo</th><th>Asistentes</th><th></th></tr>${L.map(row).join('')||`<tr><td colspan='6' class='sub'>${e}</td></tr>`}</table></div>`;
 const hoy=R.filter(t=>t.start===td);
 return `<div class='top'><div><h1>Reuniones</h1><div class='sub'>${hoy.filter(t=>t.status!=='finalizada').length} abiertas hoy · se cierran solas 12 horas después de su hora</div></div>${isAdmin()&&!ro()?`<button class="btn" onclick="openTask(0,undefined,'reunion')">+ Nueva reunión</button>`:''}</div>
 <h3 style='color:var(--steel-d)'>Hoy</h3>${tbl(hoy,'No hay reuniones hoy.')}
 <h3 style='color:var(--steel-d)'>Próximas</h3>${tbl(R.filter(t=>t.start>td),'No hay reuniones programadas.')}
 <h3 style='color:var(--steel-d)'>Anteriores (últimas 20)</h3>${tbl(R.filter(t=>t.start<td).reverse().slice(0,20),'Todavía no hay reuniones anteriores.')}`}
function dayCheck(){const n=new Date();n.setHours(0,0,0,0);if(n.getTime()===today.getTime())return;const old=f(today);today=n;if(sel===old){sel=f(today);wk=0}draw()}
setInterval(dayCheck,30000);
addEventListener('focus',dayCheck);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ==== Importar errores desde Excel (.xlsx), sin librerías externas ==== */
const canImp=()=>!ro()&&isAdmin();
function impStart(){if(!canImp())return;const i=document.createElement('input');i.type='file';i.accept='.xlsx';i.style.display='none';document.body.appendChild(i);
 i.onchange=()=>{const x=i.files[0];i.remove();if(x)impFile(x)};i.addEventListener('cancel',()=>i.remove());i.click()}
async function zipOpen(buf){
 const u=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder();let e=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('el fichero no es un .xlsx');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
 for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;
  const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  out[dec.decode(u.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+el+cl}
 return{u,dv,out}}
async function zipText(z,name){const f=z.out[name];if(!f)return null;
 const s=f.lo+30+z.dv.getUint16(f.lo+26,true)+z.dv.getUint16(f.lo+28,true),raw=z.u.subarray(s,s+f.cs);
 if(f.m===0)return new TextDecoder().decode(raw);
 if(f.m!==8)throw new Error('compresión no soportada');
 if(typeof DecompressionStream==='undefined')throw new Error('este navegador no puede descomprimir el Excel (actualízalo)');
 return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}
const xu=s=>s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-fA-F]+);/g,(m,g)=>g==='lt'?'<':g==='gt'?'>':g==='amp'?'&':g==='quot'?'"':g==='apos'?"'":String.fromCodePoint(g[1]==='x'?parseInt(g.slice(2),16):+g.slice(1))).replace(/_x([0-9A-Fa-f]{4})_/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
const xt=b=>{let s='';for(const t of b.matchAll(/<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g))s+=t[1]||'';return xu(s)};
function ssParse(x){const o=[];for(const m of x.matchAll(/<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g))o.push(xt((m[1]||'').replace(/<rPh\b[\s\S]*?<\/rPh>/g,'')));return o}
function shParse(x,ss){const rows=[];
 for(const r of x.matchAll(/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){const row=[];
  for(const c of(r[1]||'').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
   const a=c[1],ref=/\br="([A-Z]+)\d+"/.exec(a);if(!ref)continue;let ci=0;for(const ch of ref[1])ci=ci*26+ch.charCodeAt(0)-64;
   const ty=(/\bt="(\w+)"/.exec(a)||[])[1],b=c[2]||'',vm=/<v>([\s\S]*?)<\/v>/.exec(b);
   row[ci-1]=ty==='s'?(vm?ss[+vm[1]]||'':''):ty==='inlineStr'?xt(b):(vm?xu(vm[1]):'')}
  rows.push(row)}
 return rows}
async function impParse(file){
 const z=await zipOpen(await file.arrayBuffer()),wb=await zipText(z,'xl/workbook.xml'),rl=await zipText(z,'xl/_rels/workbook.xml.rels');
 if(!wb||!rl)throw new Error('el fichero no es un Excel válido');
 const sx=await zipText(z,'xl/sharedStrings.xml'),ss=sx?ssParse(sx):[],rel={};
 for(const m of rl.matchAll(/<Relationship\b([^>]*?)\/?>/g)){const i=/\bId="([^"]+)"/.exec(m[1]),t=/\bTarget="([^"]+)"/.exec(m[1]);if(i&&t)rel[i[1]]=t[1].startsWith('/')?t[1].slice(1):'xl/'+t[1]}
 for(const m of wb.matchAll(/<sheet\b([^>]*?)\/>/g)){
  const rid=/\br:id="([^"]+)"/.exec(m[1]),path=rid&&rel[rid[1]],xml=path&&await zipText(z,path);if(!xml)continue;
  const rows=shParse(xml,ss);if(!rows.length)continue;
  const H={};rows[0].forEach((h,i)=>{const k=nz(h).trim();if(k&&!(k in H))H[k]=i});
  if(H.id===undefined||H.bloque_log===undefined)continue;
  const g=(r,k)=>H[k]===undefined?'':String(r[H[k]]==null?'':r[H[k]]);
  return rows.slice(1).map(r=>({id:g(r,'id').trim(),severidad:g(r,'severidad'),codigo:g(r,'codigo'),componente:g(r,'componente'),fichero:g(r,'fichero'),linea:g(r,'linea'),error_advertencia:g(r,'error_advertencia'),como_corregir:g(r,'como_corregir'),fragmento:g(r,'fragmento'),bloque_log:g(r,'bloque_log')})).filter(r=>r.id||r.bloque_log)}
 throw new Error('no encuentro ninguna hoja con las columnas ID y Bloque_Log')}
/* Corrige texto mal codificado en el Excel (UTF-8 leído como CP850) y normaliza saltos de línea */
const impFix=s=>String(s==null?'':s).replace(/Ôöé/g,'│').replace(/ÔòÁ/g,'╵').replace(/Ôû▓/g,'▲').replace(/├│/g,'ó').replace(/├▒/g,'ñ').replace(/\r*\n|\r/g,'\n');
function impTitle(r){const b=impFix(r.bloque_log);
 let s=(b.split(/\n[ \t]*\n/)[0]||'').replace(/\s+/g,' ').trim().replace(/^(?:X|▲)\s*\[(?:ERROR|WARNING)\]\s*/i,'').replace(/\s*\[plugin [^\]]*\]\s*$/,'').trim().replace(/^(\S+?:)\s+\1\s*/,'$1 ');
 if(!s)s=[r.codigo,impFix(r.error_advertencia)].filter(Boolean).join(': ')||('Error '+r.id);
 if(s.length>110){s=s.slice(0,110);const i=s.lastIndexOf(' ');s=(i>60?s.slice(0,i):s).replace(/[\s,;:.]+$/,'')+'…'}
 return s}
function impDesc(r){const W=17,pad=s=>s+' '.repeat(Math.max(0,W-s.length)),ind=' '.repeat(W+3);
 const F=[['ID',r.id],['Severidad',r.severidad],['Código',r.codigo],['Componente',r.componente],['Fichero',r.fichero],['Línea',r.linea],['Error_Advertencia',r.error_advertencia],['Como_corregir',r.como_corregir],['Fragmento',r.fragmento],['Bloque_Log',r.bloque_log]];
 return F.map(([k,v])=>pad(k)+' : '+impFix(v).replace(/\s+$/,'').split('\n').map((l,i)=>i&&l?ind+l:l).join('\n')).join('\n')}
async function impFile(file){
 if(!canImp())return;setSt('busy','Leyendo Excel…');
 let L;try{L=await impParse(file)}catch(e){setSt('err','Excel no válido');alert('No se pudo leer el Excel: '+e.message);return}
 const have=new Set(tasks.filter(t=>t.xid).map(t=>t.xid)),seen=new Set(),nw=[];
 L.forEach(r=>{if(r.id&&(have.has(r.id)||seen.has(r.id)))return;if(r.id)seen.add(r.id);nw.push(r)});
 const dup=L.length-nw.length;
 if(!nw.length){setSt('','Sin errores nuevos');alert('No hay errores nuevos: las '+L.length+' filas del Excel ya estaban importadas.');return}
 if(!confirm('Se van a importar '+nw.length+' errores al backlog'+(dup?' ('+dup+' ya existían y se omiten)':'')+'.\n\nTipo: Error · Estado: Pendiente · Fecha: '+today.toLocaleDateString('es-ES')+'\n\n¿Continuar?')){setSt('','Importación cancelada');return}
 const ids=new Set(tasks.map(t=>t.id));let nx=nid();
 nw.forEach(r=>{while(ids.has(nx))nx++;ids.add(nx);tasks.push({id:nx,title:impTitle(r),desc:impDesc(r),start:'',end:'',status:'pendiente',owners:[],created:f(today),est:'',urgent:false,tipo:'error',xid:r.id,notes:[]})});
 blF='error';commit();
 alert(nw.length+' errores importados al backlog'+(dup?' ('+dup+' omitidos por estar ya importados)':'')+'.')}
let blF='';
function selfAssign(id){if(ro())return;if(!me()){openMe();return}const t=tasks.find(x=>x.id===id);if(!t||t.tipo!=='error'||t.owners.length||t.status!=='pendiente'){alert('Este error ya no está disponible en el backlog.');draw();return}assign(id,me().id)}
function dshort(t){const d=t.desc||'';
 if(t.tipo==='error'){const g=k=>{const m=d.match(new RegExp('^'+k+' *: (.*)$','m'));return m?m[1].trim():''},fi=g('Fichero').split('/').pop(),li=g('Línea');
  return[g('Componente'),fi&&fi+(li?':'+li:'')].filter(Boolean).join(' · ')||d.slice(0,140)}
 const s=d.replace(/\s*\n\s*/g,' · ');return s.length>160?s.slice(0,160)+'…':s}
let blQ='',blPg=0;
function blPage(d){const n=tasks.filter(t=>!t.owners.length&&t.status==='pendiente').length;blPg=Math.max(0,Math.min(Math.floor((n-1)/20),blPg+d));draw()}
function blData(){const all=tasks.filter(t=>!t.owners.length&&t.status==='pendiente'),t0=nz(blQ.trim());
 let bl=blF==='error'?all.filter(t=>t.tipo==='error'):blF==='tarea'?all.filter(t=>t.tipo!=='error'):all;
 if(t0)bl=bl.filter(t=>nz(t.title+' '+(t.desc||'')+' '+t.notes.map(n=>n.t).join(' ')+' '+names(t)).includes(t0));
 return{all,bl}}
function blList(){const{bl}=blData(),MX=300;
 return `<div class="sub" style="margin:2px 2px 8px"><b>${bl.length}</b> ${bl.length===1?'resultado':'resultados'}</div>
 ${bl.slice(0,MX).map(t=>`<div class="row"><div class="grow"><b>${t.tipo==='error'?'🐞 ':''}${t.urgent?PI:''}${esc(t.title)}</b><div class="sub">${esc(dshort(t))||'Sin descripción'}</div></div>
 <select style="width:150px" onchange="assign(${t.id},this.value)"><option value="">Asignar a…</option>${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 ${t.tipo==='error'&&isUser()&&me()?`<button class="btn sm" onclick="selfAssign(${t.id})">Asignarme</button>`:''}<button class="btn ghost sm" onclick="openTask(${t.id})">Editar</button></div>`).join('')||'<div class="tip">No hay tareas en el backlog.</div>'}
 ${bl.length>MX?`<div class="tip">Mostrando ${MX} de ${bl.length}. Al asignarlas salen de la lista; afina la búsqueda o el filtro para ver el resto.</div>`:''}`}
function blSet(v){blQ=v;const e=$('#bl-res');if(e)e.innerHTML=blList()}
function backlog(){
 const{all}=blData(),ne=all.filter(t=>t.tipo==='error').length;
 return `<div class="top"><div><h1>Backlog</h1><div class="sub">Pendientes de asignar · ${all.length-ne} tareas · ${ne} errores</div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select style="width:auto" onchange="blF=this.value;draw()"><option value="">Todo</option><option value="tarea"${blF==='tarea'?' selected':''}>Solo tareas</option><option value="error"${blF==='error'?' selected':''}>Solo errores</option></select>${canImp()?'<button class="btn ghost" onclick="impStart()">⬆ Importar errores (Excel)</button>':''}<button class="btn" onclick="openTask(0,null)">+ Añadir al backlog</button></div></div>
 <div class="qf" style="grid-template-columns:1fr"><div><label>Texto (título, descripción, seguimiento o persona)</label><input value="${esc(blQ)}" placeholder="Buscar…" oninput="blSet(this.value)"></div></div>
 <div id="bl-res">${blList()}</div>`;
}
/* ==== fin importar ==== */

const TITLE0=document.title;
let remAct={},remDone={};try{remDone=JSON.parse(localStorage.getItem('dt_rem')||'{}')}catch(e){}
const mine=t=>!linked()||(!!me()&&has(t,me().id));
function remCheck(){const now=Date.now(),L=[];
 tasks.forEach(t=>{if(t.tipo!=='reunion'||t.status==='finalizada'||!t.start||!t.hora||!mine(t))return;
  const dt=new Date(t.start+'T'+t.hora+':00').getTime()-now;if(dt>10*60e3||dt<-15*60e3)return;
  const ph=dt>0?'pre':'now',key=t.id+'|'+t.start+t.hora+'|'+ph;if(remDone[key])return;
  L.push({t,ph,key,min:Math.max(1,Math.ceil(dt/60e3))})});
 L.forEach(a=>{if(!remAct[a.key]&&window.Notification&&Notification.permission==='granted'&&document.hidden){try{new Notification((a.ph==='now'?'Reunión ahora: ':'Reunión en '+a.min+' min: ')+a.t.title,{body:a.t.hora+' · '+(a.t.reu==='ministerio'?'Con el Ministerio':'Interna'),tag:a.key,icon:'icon-192.png'})}catch(e){}}});
 remAct={};L.forEach(a=>remAct[a.key]=a);remDraw(L)}
function remDraw(L){const e=$('#rem');if(!e)return;e.hidden=!L.length;
 document.title=L.length?'🔔 '+(L[0].ph==='now'?'Reunión ahora':'Reunión en '+L[0].min+' min')+' · '+TITLE0:TITLE0;
 e.innerHTML=L.slice(0,3).map(a=>{const t=a.t,m=t.reu==='ministerio';return `<div class="remc${m?' min':''}"><div style="display:flex;gap:8px;align-items:center">${calSvg(reuC(t),+t.start.slice(8))}<b>${a.ph==='now'?'Empieza ahora':'Reunión en '+a.min+' min'} · ${esc(t.hora)}</b></div><div style="margin:4px 0 8px">${esc(t.title)}<div class="sub">${m?'Con el Ministerio':'Interna'}${t.owners.length>1?' · '+t.owners.length+' asistentes':''}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="remOpen(${t.id})">Ver</button><button class="btn ghost sm" onclick="remOk('${a.key}')">Entendido</button>${window.Notification&&Notification.permission==='default'?'<button class="btn ghost sm" onclick="remPerm()">Avisos del sistema</button>':''}</div></div>`}).join('')}
function remOk(k){remDone[k]=Date.now();const cut=Date.now()-2*864e5;Object.keys(remDone).forEach(x=>{if(remDone[x]<cut)delete remDone[x]});try{localStorage.setItem('dt_rem',JSON.stringify(remDone))}catch(e){}remCheck()}
function remOpen(id){openTask(id)}
function remPerm(){Notification.requestPermission().then(()=>remCheck())}
setInterval(remCheck,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)remCheck()});
/* Arranque: va al final para que todo lo anterior ya esté definido */
draw();loadAppCfg().then(()=>{draw();return pull()}).then(()=>remCheck());
</script>
